# Скопируйте из research_instruments.example.yaml при необходимости; UID из T-Invest (инструмент → ID).
# Загрузка ~6 месяцев (183 дня) по умолчанию:
#   python -m fix_engine.tools.fetch_research_bundle --config fix_engine/backtest/research_instruments.yaml
#
# Пустой instrument_id = TBankInstrumentId из settings.local.cfg / settings.cfg

instruments:
  - label: primary
    instrument_id: ""
    intervals:
      - { interval: 1h, days: 183, out: fix_engine/backtest/history_1h_6m.csv }
      - { interval: 4h, days: 400, out: fix_engine/backtest/history_4h_12m.csv }
      - { interval: 15m, days: 183, out: fix_engine/backtest/history_15m_6m.csv }
      - { interval: 5m, days: 183, out: fix_engine/backtest/history_5m_6m.csv }
