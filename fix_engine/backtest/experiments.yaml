  # --- Block C: min_range_atr_ratio (−10% / −20% от 2.5) ---
  - id: C_range225
    max_retest_bars_fast: 6
    min_atr_expansion: 1.08
    min_range_atr_ratio: 2.25
  - id: C_range200
    max_retest_bars_fast: 6
    min_atr_expansion: 1.08
    min_range_atr_ratio: 2.0
  - id: C_range225_r4
    max_retest_bars_fast: 4
    min_atr_expansion: 1.08
