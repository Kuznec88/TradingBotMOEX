[DEFAULT]
; TINKOFF / TINKOFF_SANDBOX — gRPC-поток; хост API задаётся TBankSandboxHost (ниже — песочница Tinkoff)
DataProvider=TINKOFF
; Свинг: только 1h или 4h; опрос API свечей (сек)
SwingCandleInterval=1h
; volume_breakout = закрытие за экстремумом SwingNLevels свечей с объёмом > SwingKVolume × средний; retest = пробой и ретест
SwingEntryMode=volume_breakout
; 1 = только закрытые свечи для входа (для ретест-FSM обязательно)
SwingSignalOnCloseOnly=1
SwingPollIntervalSec=30
SwingNLevels=20
SwingKVolume=1.5
SwingMAPeriod=50
; Y = ретест-FSM + лимит на уровне + ATR/HTF/RR (новая логика); N = классический пробой+MA+объём
SwingUseRetestFsm=Y
SwingAtrPeriod=14
; 0 = выкл.; иначе не открывать новый пробой при ATR ниже порога (в тиках или в цене)
SwingAtrMinTicks=0
SwingAtrMinPrice=0
SwingRetestTouchEpsilonTicks=0.5
SwingRetestMaxPenetrationTicks=4
SwingVolumeSpikeRequired=Y
SwingVolumeDirectional=Y
; Правило pandas resample для старшего ТФ (например 4h). Пусто = без HTF-фильтра
SwingHtfResampleRule=
SwingHtfSecondaryResampleRule=
SwingHtfSmaPeriod=100
SwingHtfHhHlLag=3
SwingRiskRewardMultiple=20.0
SwingStopBufferTicks=2.0
; Трейлинг после +1R в цене (0 = выкл., использовать SwingTrailing*Rub)
SwingTrailAfterRMultiple=2.0
SwingTrailGapRMultiple=1.5
; Не входить, если ожидаемая валовая прибыль до TP < множитель * круговая комиссия
SwingCommissionMinProfitMult=0.0
; Сколько закрытых баров ждать исполнения лимитки на ретесте
SwingLimitOrderTimeoutBars=4
; Сила пробоя: тело > impulse_k*ATR, тело>тени, close у high в пределах доли range
SwingImpulseK=0.35
SwingImpulseCloseTopRangeFrac=0.22
SwingImpulseBodyVsShadow=Y
; Ретест: max глубина касания (тики), max баров ожидания, max уход цены от уровня до ретеста
SwingRetestMaxDepthTicks=10
SwingRetestMaxBars=16
SwingRetestMaxRunawayTicks=120
SwingFalseBreakoutMaxBars=4
; HTF: наклон SMA (лаг баров), min |slope|/ATR, не входить long если цена > SMA + mult*ATR_htf
SwingHtfSlopeLag=5
SwingHtfMinSlopeNorm=0.03
SwingHtfOverextendedAtrMult=2.2
SwingHtfAtrPeriod=14
; Сессия MOEX (Europe/Moscow), обед опционально
SwingSessionTz=Europe/Moscow
SwingTradeStartHhmm=10:00
SwingTradeEndHhmm=18:45
SwingLunchSkip=Y
SwingLunchStartHhmm=12:45
SwingLunchEndHhmm=13:45
; Стоп: max(buffer*tick, adaptive_stop_atr_mult*ATR) ниже/выше уровня
SwingAdaptiveStopAtrMult=2.0
; Частичный выход на 1R (0 = выкл.); остаток: tp | trail
SwingPartialExitFraction=0.0
SwingPartialExitRMultiple=1.0
SwingPartialRemainderMode=trail
; Time-stop: 0 = выкл.; иначе закрыть всё, если за N баров прогресс к TP < доля
SwingPostEntryTimeStopBars=0
SwingPostEntryTimeStopMinTpProgress=0.12
; --- Edge / quality (см. swing_breakout.SwingBreakoutParams): 0 = выкл. там, где поддерживается ---
; ATR slope = ATR / ATR.shift(lag); пробой только если >= SwingMinAtrExpansion (напр. 1.05–1.15)
SwingAtrSlopeLag=5
SwingMinAtrExpansion=1.08
; Импульс: (high-low) > impulse_strength * max(high-low) за SwingImpulseRangeLookback предыдущих баров
SwingImpulseRangeLookback=10
SwingImpulseStrength=1.35
; Первое касание уровня ретеста не позже N баров после пробоя (медленный возврат → отказ)
SwingMaxRetestBarsFast=6
; Режим: (high_N-low_N)/ATR >= порога, иначе боковик
SwingMinRangeAtrRatio=2.5
SwingMaxTradesPerDay=5
SwingMaxLossStreak=3
SwingLossCooldownBars=30
SwingUseMarketOnStrongBreakout=Y
SwingMarketImpulseMult=1.12
; Риск ₽ на сделку / стоп в цене → qty (0 = брать лот из TBankSharesPerLot / раннер)
SwingRiskPerTradeRub=0
SwingSizingMinQty=1
SwingSizingMaxQty=100
; Пусто = не писать; иначе путь к trades_log.csv (живой раннер + бэктест при заданном пути в params)
SwingTradesLogCsvPath=log/swing_trades.csv
; Entry quality gate: do not enter if (ask-bid)/tick_size > this value
SwingMaxEntrySpreadTicks=2.0
; Legacy chop (только при SwingUseRetestFsm=N): range последних N свечей в тиках
SwingChopWindowBars=5
SwingChopMaxRangeTicks=5.0
; TP/SL в рублях на позицию (калибруйте SwingRubPerPoint под ваш фьючерс)
SwingTpRub=200
SwingSlRub=100
SwingRubPerPoint=1.0
SwingSlippageTicks=1
; Тариф «Премиум»: фьючерсы 0,025% за сделку при обороте до 12 млн ₽ в день
SwingCommissionRate=0.00025
SwingNotionalScale=1.0
SwingTrailingActivationRub=0.0
SwingTrailingGapRub=50.0
; История котировок (SQLite): окно retention_days, прореживание sample_ms
QuoteHistoryEnabled=Y
QuoteHistoryDbPath=quote_history.db
QuoteHistoryRetentionDays=14
QuoteHistorySampleIntervalMs=1000
ExecutionMode=PAPER_REAL_MARKET
; LIVE: реальные заявки T-Invest (нужны TBankSandboxToken в settings.local.cfg, TradingAccountEquities, TBankInstrumentId). Иначе PAPER_REAL_MARKET.
;TradingAccountEquities=
;TradingAccountForts=
; Количество бумаг в одном лоте инструмента (для post_order quantity в лотах)
TBankSharesPerLot=1
; Y = post_sandbox_order / cancel_sandbox_order (песочница счёта); N = продовые orders.*
TBankUseSandboxOrders=N
; Исполнение по лучшим bid/ask из стрима (без RNG/модельного slippage). При Y ключи PaperSlippage* и задержки симулятора не используются.
PaperStreamBookFills=Y
; Синтетическое исполнение (если PaperStreamBookFills=N — вероятностная модель ниже)
PaperSlippageBps=2.0
PaperSlippageMaxBps=18.0
PaperVolatilitySlippageMultiplier=1.25
PaperNetworkLatencyMs=15
PaperExchangeLatencyMs=22
PaperLatencyJitterMs=28
PaperFillParticipation=0.32
PaperTouchFillProbability=0.05
PaperPassiveFillProbabilityScale=0.32
PaperAdverseSelectionBias=0.18
PaperSlippageModel=SPREAD_FRACTION
PaperFixedSlippageAbs=0.01
PaperSpreadSlippageFraction=0.12
DecisionToSendLatencyMinMs=5
DecisionToSendLatencyMaxMs=20
SendToFillLatencyMinMs=50
SendToFillLatencyMaxMs=200
RiskMaxExposurePerInstrument=1000000
RiskMaxTradesInWindow=120
RiskTradesWindowSeconds=60
RiskCooldownAfterConsecutiveLosses=8
RiskCooldownSeconds=5
RiskMaxAbsPositionPerSymbol=1
RiskMaxDailyLossAbs=1000.0
RiskKillSwitchDrawdownAbs=3000.0
MaxInventoryPerSymbol=1
MaxInventorySoftPerSymbol=1
lot_size=1
market=FORTS
tick_size=1.0
FailureHandlingEnabled=Y
MaxMarketDataStalenessSec=60
MaxOrderStuckSec=30
MaxNoExecutionReportSec=15
FailureAction=ALERT
FailureCheckIntervalSec=1
; Песочница / gRPC T-Invest (Tinkoff host): invest-public-api.tinkoff.ru:443
TBankSandboxHost=sandbox-invest-public-api.tbank.ru:443
; Токен только в settings.local.cfg (не коммитить): TBankSandboxToken=t....
; Префикс фьючерса: текущий контракт выбирается при запуске, за N дней до экспирации новые сделки не открываются
TBankFuturesPrefix=SR
TBankFuturesRollDays=7
TBankOrderBookDepth=1
TBankIncludeTrades=Y
TBankRunDurationSec=0
; backoff при обрыве/завершении gRPC MarketDataStream (сек)
TBankMdReconnectInitialSec=1.0
TBankMdReconnectMaxSec=60.0
; 0 = выкл.; иначе закрыть gRPC-канал если нет ни одного сообщения стрима дольше N сек (зависший sandbox)
TBankMdStaleReconnectSec=25.0
